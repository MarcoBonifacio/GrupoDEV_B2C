<!DOCTYPE html>
<html lang="es-PE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Batería para auto - Leandro Baterías">
    <title>Detalle del Producto | Leandro Baterías</title>

    <link rel="icon" type="image/x-icon" href="../assets/icons/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .product-detail { margin-top: 140px; padding: 40px 0; }
        .product-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 40px; }
        .product-gallery { position: sticky; top: 160px; }
        .main-image { position: relative; border-radius: var(--radius-lg); overflow: hidden; background: var(--bg-gray); aspect-ratio: 4/3; margin-bottom: 15px; }
        .main-image img { width: 100%; height: 100%; object-fit: cover; }
        .thumbnail-list { display: flex; gap: 10px; }
        .thumbnail { width: 80px; height: 80px; border-radius: var(--radius-md); overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: all var(--transition-fast); }
        .thumbnail.active, .thumbnail:hover { border-color: var(--primary-color); }
        .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
        .product-detail-info h1 { font-size: var(--font-size-2xl); font-weight: 800; margin-bottom: 10px; }
        .product-detail-meta { display: flex; gap: 20px; margin-bottom: 20px; color: var(--text-medium); font-size: var(--font-size-sm); }
        .product-detail-price { margin-bottom: 24px; }
        .current-price { font-size: var(--font-size-3xl); font-weight: 800; color: var(--primary-color); }
        .old-price { font-size: var(--font-size-lg); color: var(--text-light); text-decoration: line-through; margin-left: 12px; }
        .discount-badge { display: inline-block; background: var(--secondary-color); color: white; padding: 4px 12px; border-radius: var(--radius-sm); font-size: var(--font-size-sm); font-weight: 600; margin-left: 10px; }
        .product-stock-status { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
        .stock-dot { width: 12px; height: 12px; border-radius: 50%; }
        .stock-dot.high { background: var(--success-color); }
        .stock-dot.low { background: var(--warning-color); }
        .stock-dot.none { background: var(--danger-color); }
        .quantity-selector { display: flex; align-items: center; gap: 15px; margin-bottom: 24px; }
        .quantity-input { display: flex; align-items: center; border: 2px solid var(--border-color); border-radius: var(--radius-md); }
        .quantity-btn { width: 40px; height: 44px; background: var(--bg-gray); border: none; font-size: var(--font-size-lg); cursor: pointer; transition: background var(--transition-fast); }
        .quantity-btn:hover { background: var(--primary-color); color: white; }
        .quantity-input input { width: 60px; height: 44px; text-align: center; border: none; font-size: var(--font-size-base); font-weight: 600; }
        .stock-info { font-size: var(--font-size-sm); color: var(--text-light); }
        .product-actions-detail { display: flex; gap: 15px; margin-bottom: 30px; }
        .product-features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; padding: 20px; background: var(--bg-gray); border-radius: var(--radius-lg); }
        .feature-item { text-align: center; }
        .feature-item i { font-size: 28px; color: var(--primary-color); margin-bottom: 8px; }
        .feature-item span { font-size: var(--font-size-sm); }
        .product-tabs { margin-top: 40px; }
        .tabs { display: flex; border-bottom: 2px solid var(--border-light); margin-bottom: 24px; }
        .tab-btn { padding: 14px 24px; font-weight: 600; color: var(--text-medium); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all var(--transition-fast); }
        .tab-btn:hover, .tab-btn.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }
        .spec-table { width: 100%; border-collapse: collapse; }
        .spec-table th, .spec-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-light); }
        .spec-table th { background: var(--bg-gray); font-weight: 600; width: 40%; }
        .related-products { margin-top: 60px; }
        .related-products h2 { font-size: var(--font-size-2xl); margin-bottom: 24px; }
        @media (max-width: 992px) { .product-detail-grid { grid-template-columns: 1fr; } .product-gallery { position: static; } .product-features { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <div class="container">
                    <div class="header-top-content">
                        <div class="header-top-left">
                            <span class="contact-item"><i class="fas fa-phone-alt"></i> (01) 234-5678</span>
                            <span class="contact-item"><i class="fab fa-whatsapp"></i> 987 654 321</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="header-main">
                <div class="container">
                    <div class="header-main-content">
                        <a href="../index.html" class="logo">
                            <div class="logo-icon"><i class="fas fa-car-battery"></i></div>
                            <div class="logo-text"><span class="logo-name">Leandro</span><span class="logo-slogan">Baterías</span></div>
                        </a>
                        <div class="search-container">
                            <div class="search-box">
                                <input type="text" class="search-input" placeholder="Buscar batería...">
                                <button class="search-button"><i class="fas fa-search"></i></button>
                            </div>
                        </div>
                        <div class="header-actions">
                            <button id="btn-cart" class="header-action-btn cart-btn">
                                <i class="fas fa-shopping-cart"></i>
                                <span class="action-badge cart-count">0</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <nav class="header-nav">
                <div class="container">
                    <ul class="nav-list">
                        <li class="nav-item"><a href="../index.html" class="nav-link"><i class="fas fa-home"></i> Inicio</a></li>
                        <li class="nav-item"><a href="catalogo.html" class="nav-link"><i class="fas fa-list"></i> Catálogo</a></li>
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="product-detail">
            <div class="container">
                <nav class="breadcrumb">
                    <a href="../index.html">Inicio</a>
                    <span class="breadcrumb-separator">/</span>
                    <a href="catalogo.html">Catálogo</a>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-current" id="breadcrumb-product">Producto</span>
                </nav>

                <div id="product-detail-content">
                    <div class="loading-spinner" style="text-align: center; padding: 60px;">
                        <i class="fas fa-spinner fa-spin" style="font-size: 48px; color: var(--primary-color);"></i>
                        <p>Cargando producto...</p>
                    </div>
                </div>

                <!-- Productos Relacionados -->
                <section class="related-products">
                    <h2>Productos Relacionados</h2>
                    <div id="related-products-grid" class="products-grid"></div>
                </section>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-bottom">
                <div class="container">
                    <p>&copy; 2026 Leandro Baterías. Todos los derechos reservados.</p>
                </div>
            </div>
        </footer>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="../js/utils/storage.js"></script>
    <script src="../js/utils/helpers.js"></script>
    <script src="../js/utils/format.js"></script>
    <script src="../js/components/producto-card.js"></script>
    <script src="../js/components/carrito.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/pages/producto-detalle.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
